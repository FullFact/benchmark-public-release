[project]
name = "benchmark_poc"
version = "1.0.0"
description = "Analysis and benchmarking of LLM responses"
authors = [{ name = "Full Fact", email = "afc@fullfact.org" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
maintainers = [{ name = "Full Fact", email = "afc@fullfact.org" }]

dependencies = [
    "python-dotenv>=1.0.0",
    "structlog>=25.4.0",
    "pydantic>=2.11.10",
    "torch",
    "sentence-transformers>=5.2.2",
    "litestar>=2.0.0",
    "uvicorn>=0.27.0",
    "matplotlib>=3.10.8",
    "google-genai>=2.29.0",
    "gspread>=6.2.1",
    "cloud-sql-python-connector[pymysql]>=1.20.1",
    "google-auth>=2.48.0",
    "click>=8.3.0",
    "numpy>=2.3",
    "hdbscan>=0.8.40",
    "umap-learn>=0.5",
    "gliner>=0.2.27",
    "huggingface-hub>=1.24.0",
    "rapidfuzz>=3.14.3",
    "text2num>=3.0.2",
    "tenacity>=8.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
genai_utils = { git = "https://github.com/FullFact/genai-utils.git", tag = "5.3.1"}

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=6.0.0",
    "isort>=5.13.3",
    "mypy>=1.4.1",
    "pandas>=3.0.3",
    "pre-commit>=3.3.3",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "types-requests>=2.32.0",
]



[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Deprecated call to `pkg_resources.declare_namespace\\('.*'\\):DeprecationWarning",
    "ignore::DeprecationWarning:google.rpc",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]

[tool.isort]
profile = "black"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
disallow_untyped_calls = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "gliner.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "text_to_num.*"
ignore_missing_imports = true

